name: Main Android Build

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Decode debug keystore
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          # 配布するAPKは必ず共通の鍵で署名する
          if [ -z "${DEBUG_KEYSTORE_BASE64}" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 が設定されていません"
            exit 1
          fi
          echo "${DEBUG_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/debug.keystore"

      - name: Build debug APK
        env:
          DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/debug.keystore
          CI_ABI_FILTER: arm64-v8a
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Build release APK
        env:
          DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/debug.keystore
          CI_ABI_FILTER: arm64-v8a
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Verify APK signature
        env:
          DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/debug.keystore
        run: |
          # 別の鍵で署名されたAPKが配布されないよう、keystoreの証明書と一致するか確認する
          EXPECTED="$(keytool -list -v -keystore "${DEBUG_KEYSTORE_PATH}" -storepass android -alias androiddebugkey \
            | grep -E '^\s*SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')"
          echo "expected SHA-256: ${EXPECTED}"
          APKSIGNER="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)/apksigner"
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            ACTUAL="$("${APKSIGNER}" verify --print-certs "${apk}" | grep 'certificate SHA-256 digest' | head -1 | sed 's/.*: *//')"
            echo "${apk}: ${ACTUAL}"
            if [ -z "${EXPECTED}" ] || [ "${EXPECTED}" != "${ACTUAL}" ]; then
              echo "::error::${apk} が DEBUG_KEYSTORE_BASE64 の鍵で署名されていません"
              exit 1
            fi
          done

      - name: Determine release version
        id: version
        run: |
          # 同じ分に複数回pushされてもタグが重複しないよう、コミットの短縮SHAを付ける
          VERSION="$(TZ=Asia/Tokyo date +%Y-%m-%d_%H-%M)_${GITHUB_SHA:0:7}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Rename APKs with release version
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          SAFE_REPO="${REPOSITORY##*/}"
          APK_NAME="app-${SAFE_REPO}-${VERSION}.apk"
          RELEASE_APK_NAME="app-${SAFE_REPO}-${VERSION}-release.apk"
          mv app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/${APK_NAME}"
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/${RELEASE_APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          echo "APK_PATH=app/build/outputs/apk/debug/${APK_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_APK_NAME=${RELEASE_APK_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_APK_PATH=app/build/outputs/apk/release/${RELEASE_APK_NAME}" >> "$GITHUB_ENV"

      - name: Archive APKs as ZIP
        run: |
          ZIP_NAME="${APK_NAME%.apk}.zip"
          RELEASE_ZIP_NAME="${RELEASE_APK_NAME%.apk}.zip"
          ZIP_PATH="app/build/outputs/apk/debug/${ZIP_NAME}"
          RELEASE_ZIP_PATH="app/build/outputs/apk/release/${RELEASE_ZIP_NAME}"
          zip -j "${ZIP_PATH}" "${APK_PATH}"
          zip -j "${RELEASE_ZIP_PATH}" "${RELEASE_APK_PATH}"
          echo "ZIP_PATH=${ZIP_PATH}" >> "$GITHUB_ENV"
          echo "RELEASE_ZIP_PATH=${RELEASE_ZIP_PATH}" >> "$GITHUB_ENV"

      - name: Upload debug APK to GitHub Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}

      - name: Upload release APK to GitHub Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RELEASE_APK_NAME }}
          path: ${{ env.RELEASE_APK_PATH }}

      - name: Run Android Lint
        env:
          CI_ABI_FILTER: arm64-v8a
        run: ./gradlew :app:lintDebug --console=plain

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.RELEASE_ZIP_PATH }}

  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run unit tests
        run: ./gradlew test --console=plain

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-report
          path: |
            **/build/reports/tests/testDebugUnitTest/
            **/build/test-results/testDebugUnitTest/

  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666",OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        env:
          CI_ABI_FILTER: x86_64
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain

      - name: Run Android Instrumentation Tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            CI_ABI_FILTER=x86_64 ./gradlew :app:connectedDebugAndroidTest --console=plain || (adb pull /sdcard/Download/picker-screenshots screenshots || true; .github/scripts/print-android-test-failures.sh; exit 1)
            adb pull /sdcard/Download/picker-screenshots screenshots || true

      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-androidtest-report
          path: |
            screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  # テストが全て成功した場合のみリリースを作成する
  release:
    runs-on: ubuntu-latest
    needs: [build, unit-test, android-test]
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          # アップロード時の共通親ディレクトリ以下の構成で展開されるため、再帰的に集める
          mapfile -t ASSETS < <(find release-assets -name '*.zip')
          gh release create "${VERSION}" "${ASSETS[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes "Commit: ${COMMIT_URL}"
