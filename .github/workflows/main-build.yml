name: Main Android Build

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Decode debug keystore
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          # Secret 未設定の場合は既定の debug 署名でビルドする
          if [ -n "${DEBUG_KEYSTORE_BASE64}" ]; then
            echo "${DEBUG_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/debug.keystore"
          fi

      - name: Build debug APK
        env:
          DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/debug.keystore
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Build release APK
        env:
          DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/debug.keystore
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Determine release version
        run: |
          VERSION="$(TZ=Asia/Tokyo date +%Y-%m-%d_%H-%M)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Rename APKs with release version
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          SAFE_REPO="${REPOSITORY##*/}"
          APK_NAME="app-${SAFE_REPO}-${VERSION}.apk"
          RELEASE_APK_NAME="app-${SAFE_REPO}-${VERSION}-release.apk"
          mv app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/${APK_NAME}"
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/${RELEASE_APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          echo "APK_PATH=app/build/outputs/apk/debug/${APK_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_APK_NAME=${RELEASE_APK_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_APK_PATH=app/build/outputs/apk/release/${RELEASE_APK_NAME}" >> "$GITHUB_ENV"

      - name: Archive APKs as ZIP
        run: |
          ZIP_NAME="${APK_NAME%.apk}.zip"
          RELEASE_ZIP_NAME="${RELEASE_APK_NAME%.apk}.zip"
          ZIP_PATH="app/build/outputs/apk/debug/${ZIP_NAME}"
          RELEASE_ZIP_PATH="app/build/outputs/apk/release/${RELEASE_ZIP_NAME}"
          zip -j "${ZIP_PATH}" "${APK_PATH}"
          zip -j "${RELEASE_ZIP_PATH}" "${RELEASE_APK_PATH}"
          echo "ZIP_PATH=${ZIP_PATH}" >> "$GITHUB_ENV"
          echo "RELEASE_ZIP_PATH=${RELEASE_ZIP_PATH}" >> "$GITHUB_ENV"

      - name: Upload debug APK to GitHub Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}

      - name: Upload release APK to GitHub Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RELEASE_APK_NAME }}
          path: ${{ env.RELEASE_APK_PATH }}

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          gh release create "${VERSION}" "${ZIP_PATH}" "${RELEASE_ZIP_PATH}" \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes "Commit: ${COMMIT_URL}"

  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run unit tests
        run: ./gradlew test --console=plain

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-report
          path: |
            **/build/reports/tests/testDebugUnitTest/
            **/build/test-results/testDebugUnitTest/

  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666",OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain

      - name: Run Android Instrumentation Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew :app:connectedDebugAndroidTest --console=plain || (adb pull /sdcard/Download/picker-screenshots screenshots || true; exit 1)
            adb pull /sdcard/Download/picker-screenshots screenshots || true

      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-androidtest-report
          path: |
            screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
